/* ==================== CROSSWORD GENERATOR ==================== */
function genCrossword(words,gs){
  const ws=words.map(x=>({...x}));
  ws.sort((a,b)=>b.w.length-a.w.length);
  const grid=Array.from({length:gs},()=>Array(gs).fill(null));
  const placed=[];
  const first=ws[0];
  const sc=Math.floor((gs-first.w.length)/2);
  const sr=Math.floor(gs/2);
  for(let i=0;i<first.w.length;i++) grid[sr][sc+i]=first.w[i];
  placed.push({w:first.w,clue:first.c,e:first.e,r:sr,c:sc,dir:"across"});
  for(let wi=1;wi<ws.length;wi++){
    const word=ws[wi];const wl=word.w.length;let best=null;
    for(const pw of placed){
      if(best)break;
      for(let pi=0;pi<pw.w.length;pi++){
        if(best)break;
        for(let wi2=0;wi2<wl;wi2++){
          if(best)break;
          if(pw.w[pi]!==word.w[wi2])continue;
          let r,c,dir;
          if(pw.dir==="across"){dir="down";r=pw.r-wi2;c=pw.c+pi;}
          else{dir="across";r=pw.r+pi;c=pw.c-wi2;}
          if(dir==="across"&&(c<0||c+wl>gs))continue;
          if(dir==="down"&&(r<0||r+wl>gs))continue;
          let ok=true;
          for(let i=0;i<wl;i++){
            const cr=dir==="across"?r:r+i;
            const cc=dir==="across"?c+i:c;
            const isInt=(cr===pw.r&&cc===pw.c+pi)||(cr===pw.r+pi&&cc===pw.c);
            if(grid[cr][cc]!==null&&!isInt&&grid[cr][cc]!==word.w[i]){ok=false;break;}
          }
          if(!ok)continue;
          let adjOk=true;
          for(let i=0;i<wl&&adjOk;i++){
            const cr=dir==="across"?r:r+i;
            const cc=dir==="across"?c+i:c;
            const isInt=(cr===pw.r&&cc===pw.c+pi)||(cr===pw.r+pi&&cc===pw.c);
            if(dir==="across"){
              if(cr>0&&grid[cr-1][cc]!==null&&!isInt)adjOk=false;
              if(cr<gs-1&&grid[cr+1][cc]!==null&&!isInt)adjOk=false;
            }else{
              if(cc>0&&grid[cr][cc-1]!==null&&!isInt)adjOk=false;
              if(cc<gs-1&&grid[cr][cc+1]!==null&&!isInt)adjOk=false;
            }
          }
          if(adjOk&&dir==="across"){
            if(c>0&&grid[r][c-1]!==null)adjOk=false;
            if(c+wl<gs&&grid[r][c+wl]!==null)adjOk=false;
          }
          if(adjOk&&dir==="down"){
            if(r>0&&grid[r-1][c]!==null)adjOk=false;
            if(r+wl<gs&&grid[r+wl][c]!==null)adjOk=false;
          }
          if(adjOk)best={word,r,c,dir};
        }
      }
    }
    if(best){
      for(let i=0;i<wl;i++){
        const cr=best.dir==="across"?best.r:best.r+i;
        const cc=best.dir==="across"?best.c+i:best.c;
        grid[cr][cc]=best.word.w[i];
      }
      placed.push({w:best.word.w,clue:best.word.c,e:best.word.e,r:best.r,c:best.c,dir:best.dir});
    }
  }
  return{grid,placed};
}

function computeNums(placed){
  const nums={};let n=1;
  const starts=placed.map(p=>({r:p.r,c:p.c})).sort((a,b)=>a.r-b.r||a.c-b.c);
  const seen=new Set();
  for(const s of starts){
    const k=s.r+","+s.c;
    if(!seen.has(k)){seen.add(k);nums[k]=n++;}
  }
  return nums;
}

function makePuzzle(diff){
  const cfg=DIFFICULTIES.find(d=>d.key===diff);
  const gs=cfg.gridSize;
  const words=WORDS[diff].map(x=>({...x}));
  let best=null;
  for(let a=0;a<500;a++){
    const sh=[...words].sort(()=>Math.random()-0.5);
    const res=genCrossword(sh,gs);
    if(!best||res.placed.length>best.placed.length){best=res;if(res.placed.length>=words.length)break;}
  }
  let minR=gs,maxR=0,minC=gs,maxC=0;
  for(let r=0;r<gs;r++)for(let c=0;c<gs;c++)
    if(best.grid[r][c]!==null){minR=Math.min(minR,r);maxR=Math.max(maxR,r);minC=Math.min(minC,c);maxC=Math.max(maxC,c);}
  const tg=[];
  for(let r=minR;r<=maxR;r++)tg.push(best.grid[r].slice(minC,maxC+1));
  const pw=best.placed.map(p=>({...p,r:p.r-minR,c:p.c-minC}));
  const rows=tg.length,cols=tg[0].length;
  const nums=computeNums(pw);
  const pw2=pw.map(p=>({...p,num:nums[p.r+","+p.c]}));
  const ac=pw2.filter(p=>p.dir==="across").sort((a,b)=>a.r-b.r||a.c-b.c);
  const dn=pw2.filter(p=>p.dir==="down").sort((a,b)=>a.r-b.r||a.c-b.c);
  return{grid:tg,words:pw2,across:ac,down:dn,nums,rows,cols};
}

/* ==================== HELPERS ==================== */
function isLetter(grid,r,c){return r>=0&&r<grid.length&&c>=0&&c<grid[0].length&&grid[r][c]!==null;}

function getWordCells(word){
  const cells=[];
  for(let i=0;i<word.w.length;i++)
    cells.push({r:word.r+(word.dir==="down"?i:0),c:word.c+(word.dir==="across"?i:0)});
  return cells;
}

function getCurrentWord(puzzle,cell,dir){
  if(!cell)return null;
  const list=dir==="across"?puzzle.across:puzzle.down;
  return list.find(w=>{
    const cells=getWordCells(w);
    return cells.some(c=>c.r===cell.r&&c.c===cell.c);
  });
}

function cellInWord(cell,w){
  for(let i=0;i<w.w.length;i++){
    const r=w.r+(w.dir==="down"?i:0);
    const c=w.c+(w.dir==="across"?i:0);
    if(r===cell.r&&c===cell.c)return true;
  }
  return false;
}

/* ==================== GAME ENGINE ==================== */
let state={
  diff:"easy",puzzle:null,ans:null,revealed:null,result:null,
  active:null,dir:"across",hints:0,wrong:0,won:false,
  timer:0
};
let timerInterval=null;

function formatTime(s){
  const m=Math.floor(s/60);
  const sec=s%60;
  return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
}

function getDC(diff){return DIFFICULTIES.find(d=>d.key===diff);}

function startGame(d){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  const p=makePuzzle(d);
  state.diff=d;
  state.puzzle=p;
  state.ans=Array.from({length:p.rows},()=>Array(p.cols).fill(""));
  state.revealed=Array.from({length:p.rows},()=>Array(p.cols).fill(false));
  state.result=Array.from({length:p.rows},()=>Array(p.cols).fill(null));
  state.active=null;state.dir="across";state.hints=0;state.wrong=0;state.won=false;
  state.timer=0;
  timerInterval=setInterval(()=>{if(!state.won){state.timer++;updateTimer();}},1000);
  render();
}

function clearResults(){
  state.result=Array.from({length:state.puzzle.rows},()=>Array(state.puzzle.cols).fill(null));
}

function navNext(){
  if(!state.active)return;
  const p=state.puzzle;
  const dr=state.dir==="down"?1:0;
  const dc=state.dir==="across"?1:0;
  let r=state.active.r+dr,c=state.active.c+dc;
  while(isLetter(p.grid,r,c)&&state.ans[r][c]){r+=dr;c+=dc;}
  if(isLetter(p.grid,r,c))state.active={r,c};
}

function navPrev(){
  if(!state.active)return;
  const p=state.puzzle;
  const dr=state.dir==="down"?-1:0;
  const dc=state.dir==="across"?-1:0;
  const r=state.active.r+dr,c=state.active.c+dc;
  if(isLetter(p.grid,r,c))state.active={r,c};
}

function getNextWord(){
  const p=state.puzzle;
  const list=state.dir==="across"?p.across:p.down;
  for(const w of list){
    const cells=getWordCells(w);
    let hasEmpty=false,allFilled=true;
    for(const cell of cells){
      if(!state.ans[cell.r][cell.c]){hasEmpty=true;allFilled=false;break;}
    }
    if(hasEmpty)return cells.find(cell=>!state.ans[cell.r][cell.c]);
  }
  return null;
}

function clickCell(r,c){
  const p=state.puzzle;
  if(!isLetter(p.grid,r,c)||state.won)return;
  if(state.active&&state.active.r===r&&state.active.c===c){
    const ca=p.across.some(w=>cellInWord({r,c},w));
    const cd=p.down.some(w=>cellInWord({r,c},w));
    if(ca&&cd)state.dir=state.dir==="across"?"down":"across";
  }else{
    state.active={r,c};
    const ca=p.across.some(w=>cellInWord({r,c},w));
    const cd=p.down.some(w=>cellInWord({r,c},w));
    if(!ca&&state.dir==="across")state.dir="down";
    if(!cd&&state.dir==="down")state.dir="across";
  }
  clearResults();
  render();
  document.getElementById("cw-grid").focus();
}

function handleKey(e){
  if(!state.active||state.won||!state.puzzle)return;
  const ch=e.key.toUpperCase();
  const p=state.puzzle;
  if(/^[A-Z]$/.test(ch)){
    e.preventDefault();
    state.ans[state.active.r][state.active.c]=ch;
    clearResults();
    const prev={r:state.active.r,c:state.active.c};
    navNext();
    if(state.active.r===prev.r&&state.active.c===prev.c){
      const nw=getNextWord();
      if(nw)state.active=nw;
    }
    render();
  }else if(e.key==="Backspace"){
    e.preventDefault();
    if(state.ans[state.active.r][state.active.c]){
      state.ans[state.active.r][state.active.c]="";
    }else{
      navPrev();
      if(state.active)state.ans[state.active.r][state.active.c]="";
    }
    render();
  }else if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)){
    e.preventDefault();
    const d=e.key==="ArrowUp"||e.key==="ArrowDown"?"down":"across";
    state.dir=d;
    const dr2=e.key==="ArrowDown"?1:e.key==="ArrowUp"?-1:0;
    const dc2=e.key==="ArrowRight"?1:e.key==="ArrowLeft"?-1:0;
    const nr=state.active.r+dr2,nc=state.active.c+dc2;
    if(isLetter(p.grid,nr,nc))state.active={r:nr,c:nc};
    render();
  }else if(e.key==="Tab"){
    e.preventDefault();
    state.dir=state.dir==="across"?"down":"across";
    render();
  }
}

function doCheck(){
  if(!state.puzzle||state.won)return;
  const p=state.puzzle;
  const res=Array.from({length:p.rows},()=>Array(p.cols).fill(null));
  let allOk=true,allFilled=true;
  for(let r=0;r<p.rows;r++)for(let c=0;c<p.cols;c++)
    if(p.grid[r][c]!==null){
      if(!state.ans[r][c])allFilled=false;
      else if(state.ans[r][c]===p.grid[r][c])res[r][c]="ok";
      else{res[r][c]="err";allOk=false;}
    }
  state.result=res;
  if(allOk&&allFilled)state.won=true;
  else if(!allOk)state.wrong++;
  render();
}

function doHint(){
  const dc=getDC(state.diff);
  if(!state.puzzle||state.won||state.hints>=dc.maxHints)return;
  const p=state.puzzle;
  for(let r=0;r<p.rows;r++)for(let c=0;c<p.cols;c++)
    if(p.grid[r][c]!==null&&!state.revealed[r][c]&&state.ans[r][c]!==p.grid[r][c]){
      state.ans[r][c]=p.grid[r][c];
      state.revealed[r][c]=true;
      state.hints++;
      state.active={r,c};
      let done=true;
      for(let r2=0;r2<p.rows;r2++)for(let c2=0;c2<p.cols;c2++)
        if(p.grid[r2][c2]!==null&&state.ans[r2][c2]!==p.grid[r2][c2])done=false;
      if(done)state.won=true;
      render();return;
    }
}

function doConfirm(){
  if(!state.puzzle||state.won)return;
  const p=state.puzzle;
  let allOk=true;
  for(let r=0;r<p.rows;r++)for(let c=0;c<p.cols;c++)
    if(p.grid[r][c]!==null&&state.ans[r][c]!==p.grid[r][c])allOk=false;
  if(allOk){state.won=true;render();}
  else{doCheck();state.wrong++;render();}
}

/* ==================== RENDER ==================== */
function updateTimer(){
  const el=document.getElementById("cw-timer");
  if(el)el.textContent=formatTime(state.timer);
}

function render(){
  const p=state.puzzle;
  const dc=getDC(state.diff);
  const curWord=getCurrentWord(p,state.active,state.dir);
  const curCells=curWord?getWordCells(curWord):[];
  const gridBase=state.diff==='nightmare'?420:580;
  const cellSz=Math.max(28,Math.min(50,Math.floor(gridBase/Math.max(p.rows,p.cols))));
  const numFs=Math.max(7,cellSz*0.2);
  const letFs=Math.max(14,cellSz*0.44);

  function isCur(r,c){return curCells.some(cl=>cl.r===r&&cl.c===c);}

  function clueText(w){
    if(state.diff==="hard"||state.diff==="nightmare")return w.e;
    return w.clue;
  }

  let gridHTML="";
  for(let r=0;r<p.rows;r++){
    for(let c=0;c<p.cols;c++){
      const isL=p.grid[r][c]!==null;
      if(!isL){gridHTML+='<div class="cw-cell blk" style="width:'+cellSz+'px;height:'+cellSz+'px"></div>';continue;}
      const k=r+","+c;
      const num=p.nums[k];
      const ia=state.active&&state.active.r===r&&state.active.c===c;
      const ih=isCur(r,c);
      const ir=state.revealed[r][c];
      const rs=state.result[r][c];
      let cls="cw-cell";
      if(ia)cls+=" act";else if(ih)cls+=" hl";
      if(ir)cls+=" rev";
      if(rs==="ok")cls+=" rok";
      if(rs==="err")cls+=" rerr";
      gridHTML+='<div class="'+cls+'" style="width:'+cellSz+'px;height:'+cellSz+'px" onclick="clickCell('+r+','+c+')"><div class="cw-ci" style="font-size:'+letFs+'px">';
      if(num)gridHTML+='<span class="cw-cn" style="font-size:'+numFs+'px">'+num+'</span>';
      gridHTML+=(state.ans[r][c]||"")+'</div></div>';
    }
  }

  let acrossHTML="";
  p.across.forEach((w,i)=>{
    const isActive=curWord===w;
    acrossHTML+='<div class="cw-cg cw-cl-item'+(isActive?" act":"")+'"><div class="cw-cgt">'+w.num+'. '+w.w.length+' letters</div><div class="cw-ct">'+clueText(w)+'</div></div>';
  });

  let downHTML="";
  p.down.forEach((w,i)=>{
    const isActive=curWord===w;
    downHTML+='<div class="cw-cg cw-cl-item'+(isActive?" act":"")+'"><div class="cw-cgt">'+w.num+'. '+w.w.length+' letters</div><div class="cw-ct">'+clueText(w)+'</div></div>';
  });

  let diffsHTML="";
  DIFFICULTIES.forEach(d=>{
    const sel=state.diff===d.key;
    diffsHTML+='<button class="cw-dbtn" style="border-color:'+(sel?d.color:"#e2e8f0")+';color:'+(sel?d.color:"#64748b")+';background:'+(sel?d.color+"14":"#fff")+'" onclick="setDiff(\''+d.key+'\')">'+d.label+'</button>';
  });

  const hintsLeft=dc.maxHints-state.hints;

  let winHTML="";
  if(state.won){
    if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
    winHTML='<div class="cw-win" onclick="closeWin()"><div class="cw-wbox" onclick="event.stopPropagation()"><div class="cw-wemo">&#127881;</div><div class="cw-wt">Congratulations!</div><div class="cw-ws">Time: '+formatTime(state.timer)+' &middot; Hints: '+state.hints+' &middot; Wrong: '+state.wrong+'</div><button class="cw-wbtn" onclick="newGame()">Play Again</button></div></div>';
  }

  document.getElementById("app").innerHTML=
    '<div class="cw-wrap">'+
    '<div class="cw-hdr"><div class="cw-title">Crossword Puzzle - 英语填词游戏</div>'+
    '<div class="cw-diffs">'+diffsHTML+'</div>'+
    '<div id="cw-timer" class="cw-timer">'+formatTime(state.timer)+'</div></div>'+
    '<div class="cw-body" style="'+(state.diff==='nightmare'?'gap:10px;flex-wrap:nowrap;':'')+'">'+
      '<div class="cw-gsec" style="'+(state.diff==='nightmare'?'padding:12px;flex-shrink:0;':'')+'">'+
        '<div id="cw-grid" class="cw-grid" tabindex="0" style="display:inline-grid;grid-template-columns:repeat('+p.cols+','+cellSz+'px);grid-template-rows:repeat('+p.rows+','+cellSz+'px)">'+gridHTML+'</div>'+
        '<div class="cw-bar">'+
          '<button class="cw-btn cw-bc" onclick="doCheck()"'+(state.won?" disabled":"")+'>Check</button>'+
          '<button class="cw-btn cw-bh" onclick="doHint()"'+(state.won||state.hints>=dc.maxHints?" disabled":"")+'>Hint ('+hintsLeft+')</button>'+
          '<button class="cw-btn cw-bk" onclick="doConfirm()"'+(state.won?" disabled":"")+'>Confirm</button>'+
          '<button class="cw-btn cw-bn" onclick="newGame()">New Game</button>'+
        '</div>'+
        '<div class="cw-info"><span>Words: '+p.words.length+'</span><span>Hints: '+state.hints+'/'+dc.maxHints+'</span><span>Wrong: '+state.wrong+'</span><span>'+(state.dir==="across"?"Across ↓":"Down →")+'</span></div>'+
      '</div>'+
      '<div class="cw-csec" style="'+(state.diff==='nightmare'?'min-width:0;flex:1;':'')+'">'+
        '<div class="cw-ch">Clues - 题目</div>'+
        '<div class="cw-cl" style="'+(state.diff==='nightmare'?'column-count:1;':'')+'"><div class="cw-cg" style="font-size:12px;font-weight:700;color:#1e40af;margin-bottom:4px;'+(state.diff==='nightmare'?'':'column-span:all')+'">ACROSS - 横向</div>'+acrossHTML+'</div>'+
        '<div class="cw-cl" style="'+(state.diff==='nightmare'?'column-count:1;':'')+'"><div class="cw-cg" style="font-size:12px;font-weight:700;color:#1e40af;margin-bottom:4px;'+(state.diff==='nightmare'?'':'column-span:all')+'">DOWN - 纵向</div>'+downHTML+'</div>'+
      '</div>'+
    '</div>'+winHTML+'</div>';

  // Re-attach keydown listener
  const gridEl=document.getElementById("cw-grid");
  if(gridEl){gridEl.addEventListener("keydown",handleKey);gridEl.focus();}
}

function setDiff(d){state.diff=d;startGame(d);}
function newGame(){startGame(state.diff);}
function closeWin(){state.won=false;render();}

// Boot
startGame("easy");
</script>
